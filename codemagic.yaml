definitions:
  scripts:
    - &go_toolchain
      name: Report Go toolchain
      script: |
        # macOS runners ship Go preinstalled. The engine module pins its own
        # toolchain in go.mod, so record the version rather than fighting brew.
        go version
        go env GOROOT

workflows:

  # ---------------------------------------------------------------------------
  # Unsigned build — works with zero Codemagic UI setup.
  # Produces a sideloadable IPA (no provisioning profile, no certificate).
  # ---------------------------------------------------------------------------
  ios-unsigned:
    name: iOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "OpenFlux.xcodeproj"
        XCODE_SCHEME: "OpenFlux"

    triggering:
      events:
        - push
        - pull_request
      cancel_previous_builds: true

    scripts:
      - *go_toolchain

      - name: Prime Go module cache
        script: |
          cd ios/OpenFlux/GoEngine/engine
          # Optional cache warmup; the engine build repeats this with strict
          # error handling before compiling the native archive.
          go mod download || true

      - name: Build archive (unsigned)
        script: |
          set -euo pipefail
          cd ios/OpenFlux
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/OpenFlux.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$CM_BUILD_DIR/xcodebuild-archive.log" | xcbeautify
          test -d "$CM_BUILD_DIR/OpenFlux.xcarchive/Products/Applications/OpenFlux.app"

      - name: Verify engine flavour
        script: |
          set -euo pipefail
          # Tells a real tunnel apart from the generated no-op archive, so a
          # green build is not mistaken for a working engine.
          LIB="ios/OpenFlux/GoEngine/liboflux.a"
          nm -gU "$LIB" > "$CM_BUILD_DIR/engine-symbols.log"
          if grep -q '_OpenFluxBytesIn' "$CM_BUILD_DIR/engine-symbols.log" && ! grep -q '_OpenFluxStubBuildMarker' "$CM_BUILD_DIR/engine-symbols.log"; then
            echo "engine: NATIVE (Go c-archive)"
          else
            echo "engine: STUB — the app will refuse to connect at runtime"
            exit 1
          fi

      - name: Package IPA
        script: |
          set -euo pipefail
          APP=$(find "$CM_BUILD_DIR/OpenFlux.xcarchive/Products/Applications" \
                -maxdepth 1 -name '*.app' | head -n1)
          if [ -z "$APP" ]; then
            echo "no .app in archive" >&2
            exit 1
          fi
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/ipa/Payload/"
          cd "$CM_BUILD_DIR/ipa"
          zip -qry OpenFlux-unsigned.ipa Payload
          rm -rf Payload

    artifacts:
      - $CM_BUILD_DIR/xcodebuild-archive.log
      - $CM_BUILD_DIR/engine-symbols.log
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/OpenFlux.xcarchive
      - /tmp/xcodebuild_logs/*.log

  # ---------------------------------------------------------------------------
  # Signed App Store / TestFlight build.
  #
  # Requires, in the Codemagic UI:
  #   1. An App Store Connect integration (Teams > Integrations).
  #   2. The bundle identifier below registered in your Apple Developer account.
  # Without both, this workflow fails at the signing step — use ios-unsigned.
  # ---------------------------------------------------------------------------
  ios-release:
    name: iOS Signed Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.openflux.app
      vars:
        XCODE_PROJECT: "OpenFlux.xcodeproj"
        XCODE_SCHEME: "OpenFlux"

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: false

    scripts:
      - *go_toolchain

      - name: Prime Go module cache
        script: |
          cd ios/OpenFlux/GoEngine/engine
          go mod download || true

      - name: Set build number
        script: |
          cd ios/OpenFlux
          # PROJECT_BUILD_NUMBER is Codemagic's monotonic per-workflow counter,
          # so this needs no App Store Connect round-trip.
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Apply signing profiles
        script: |
          cd ios/OpenFlux
          # ios_signing above fetched the certificate and profile; this writes
          # them into the project's build settings.
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd ios/OpenFlux
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/OpenFlux/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Uncomment once the App Store Connect integration exists.
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      #   beta_groups:
      #     - Internal Testers
      scripts:
        - name: Summary
          script: echo "IPA ready in ios/OpenFlux/build/ios/ipa"
